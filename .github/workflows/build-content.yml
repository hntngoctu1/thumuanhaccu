name: Build site from content

# When the CMS commits a change to content/ (or build scripts change),
# regenerate the static HTML and commit it back. Vercel (Git-connected)
# then auto-deploys the regenerated files.
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: build-content
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate blog + homepage from content/
        run: |
          python scripts/build_blog.py
          python scripts/build_home.py

      - name: Commit regenerated files (if any)
        run: |
          git config user.name "doremi-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cam-nang/ sitemap.xml index.html
          if git diff --staged --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: rebuild site from content [skip ci]"
            git push
          fi
